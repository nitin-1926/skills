# .github/workflows/release.yml
# Fires on a v* tag. Stages the release via trusted publishing (OIDC), so a
# maintainer approves it with 2FA before anyone can install it.
#
# TEMPLATE: adjust the node version, package name, and script names.
#
# WHY STAGE INSTEAD OF PUBLISH:
#   • No long-lived npm token exists anywhere. Nothing to leak or rotate.
#   • Provenance is generated automatically (only possible from a cloud runner
#     with an OIDC token — a local `npm publish` cannot produce it).
#   • A compromised workflow can only STAGE. Shipping needs a human with 2FA.
#   • Survives npm's deprecation of 2FA-bypass tokens (degraded Aug 2026,
#     publishing removed Jan 2027).
#
# Requires a trusted publisher configured at:
#   npmjs.com → <package> → Settings → Trusted Publisher
#   → GitHub Actions, this repo, workflow filename `release.yml`
#   → Allowed actions: `npm stage publish` only
#
# For direct publishing without the approval gate, use `npm publish` below and
# allow that action on the trusted publisher instead. You lose the human gate;
# you keep provenance and the absence of tokens.

name: Release

on:
    push:
        tags: ['v*']

jobs:
    stage:
        name: Stage the release on npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write # Required for OIDC. Without it there is no trusted publishing.
        steps:
            - uses: actions/checkout@v4

            # NO `registry-url:` here, deliberately. Setting it makes setup-node
            # write a temp .npmrc containing
            #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
            # point NPM_CONFIG_USERCONFIG at it, and export the placeholder
            # NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX. npm sends that literal
            # string and gets a 401 — the explicit token overrides the OIDC
            # exchange trusted publishing depends on. Provenance still signs, so
            # the failure looks like a registry problem rather than a config one.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            # --ignore-scripts because this job holds `id-token: write`: a
            # postinstall in any transitive devDependency could otherwise read
            # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN and mint an npm publish token.
            # `npm stage` landed in npm 11, and the Node 22 runner image still
            # bundles npm 10.9 — so without this, staging fails with
            # `Unknown command: "stage"`. Pin the major rather than relying on
            # whatever npm the Node image happens to ship.
            - name: Install an npm that has `npm stage`
              run: |
                  npm install -g npm@^11
                  npm --version
                  npm stage --help >/dev/null 2>&1 \
                    || { echo "::error::this npm has no 'stage' subcommand"; exit 1; }

            - run: npm ci --ignore-scripts

            # npm versions are immutable. A tarball whose version disagrees with
            # its tag cannot be corrected, only deprecated — so fail before
            # staging, not after.
            - name: Fail if the tag does not match package.json
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg=$(node -p "require('./package.json').version")
                  if [ "$tag" != "$pkg" ]; then
                    echo "::error::Tag v$tag does not match package.json version $pkg"
                    exit 1
                  fi

            # A version can already be on the registry for two legitimate
            # reasons: the bootstrap release was published locally (a brand-new
            # package cannot use trusted publishing, because the trusted
            # publisher lives in package settings that do not exist yet), or a
            # tag was re-pushed after a failure further down. Staging either one
            # fails on an immutable-version error, so detect it and skip
            # straight to cutting the GitHub release.
            #
            # Asked via the per-version endpoint rather than `npm view`. Every
            # `npm view` fetches the full packument, which is served through a
            # CDN that has been seen holding a stale copy for the better part of
            # an hour after a publish. Using it here would report an
            # already-published version as absent, stage it again, and fail on
            # an immutable-version error.
            - name: Is this version already published?
              id: published
              run: |
                  pkg=$(node -p "require('./package.json').name")
                  ver=$(node -p "require('./package.json').version")
                  code=$(curl -fsS -o /dev/null -w '%{http_code}' \
                    "https://registry.npmjs.org/$pkg/$ver" 2>/dev/null || true)
                  if [ "$code" = "200" ]; then
                    echo "already=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::$pkg@$ver is already on npm — skipping the staging step."
                  else
                    echo "already=false" >> "$GITHUB_OUTPUT"
                  fi

            - run: npm run check

            # Builds, packs and verifies the real tarball — the same gate CI runs on
            # every PR. No separate build step: this does it, and so does
            # prepublishOnly, so a third build would just cost time.
            - run: npm run smoke

            # Turns a confusing "E401 invalid token" into a message naming the
            # cause. Any explicit _authToken in scope overrides OIDC.
            - name: Assert nothing is shadowing the OIDC exchange
              run: |
                  token="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)"
                  case "$token" in
                    ''|undefined|null) echo "No explicit auth token configured — OIDC will be used." ;;
                    *) echo "::error::An npm _authToken is configured; it overrides trusted publishing."
                       exit 1 ;;
                  esac

            # Provenance is automatic here — do not add --provenance.
            - name: Stage the package
              if: steps.published.outputs.already != 'true'
              run: npm stage publish

            - name: Explain what happens next
              if: steps.published.outputs.already != 'true'
              run: |
                  {
                    echo "### Staged, awaiting approval"
                    echo ""
                    echo "Nothing is installable yet. Approve with 2FA from your own machine:"
                    echo ""
                    echo '```bash'
                    echo "npm stage list PACKAGE_NAME"
                    echo "npm stage approve <stage-id>"
                    echo '```'
                    echo ""
                    echo "Or approve on npmjs.com. To discard: \`npm stage reject <stage-id>\`."
                  } >> "$GITHUB_STEP_SUMMARY"

            # Idempotent: the documented recovery for a failed release is to
            # delete and re-push the tag, and a bare `create` then fails with
            # "release already exists" and reddens an otherwise-fine run.
            - name: Create the GitHub release
              run: |
                  gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
                  gh release create "$GITHUB_REF_NAME" \
                    --title "$GITHUB_REF_NAME" \
                    --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

                  The npm package for this tag is **staged, pending maintainer approval**."
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
