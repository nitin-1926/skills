# .github/workflows/ci.yml
# TEMPLATE: adjust the node matrix and script names.

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Nothing in CI needs to write. Without this the job inherits the repository
# default, which on older repos is read/write for the whole token.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test on Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Match the floor declared in package.json "engines".
                # Node 18 is end-of-life (April 2025) and keeps
                # `globalThis.crypto` behind --experimental-global-webcrypto -
                # it was only unflagged in Node 19. Any package touching
                # WebCrypto passes locally and fails here. Keep `engines` in
                # package.json in step with this list.
                node: ['20', '22', '24']
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test

    smoke:
        name: Packaged artifact
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            # Everything that could go wrong between "tests pass" and "consumers
            # can actually use it" lives in one script, so the gate is identical
            # locally and in CI: builds, packs, installs the tarball into a
            # throwaway consumer, and asserts entry points, types, size budgets,
            # and any package-specific invariant survived the build.
            - name: Smoke test the packaged artifact
              run: npm run smoke

    release-config:
        name: Validate release config
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Catch a broken release script at PR time rather than at tag time,
            # when a mistake means a half-published version.
            - name: Shell syntax
              run: |
                  bash -n scripts/release.sh
                  bash -n scripts/smoke-test.sh

            - name: Scripts are executable
              run: |
                  for f in scripts/release.sh scripts/smoke-test.sh; do
                    [ -x "$f" ] || { echo "::error::$f is not executable (git update-index --chmod=+x $f)"; exit 1; }
                  done

            - name: package.json version is valid semver
              run: |
                  v="$(node -p "require('./package.json').version")"
                  echo "version: $v"
                  echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
                    || { echo "::error::'$v' is not valid semver"; exit 1; }
